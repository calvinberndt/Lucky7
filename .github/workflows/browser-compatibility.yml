name: Browser compatibility

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/lucky7-browser-tools" --no-save --package-lock=false playwright@1.64.0
          "$RUNNER_TEMP/lucky7-browser-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
      - name: Test Chromium, Firefox, and WebKit
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/lucky7-browser-tools/node_modules
        run: |
          mkdir -p "$RUNNER_TEMP/browser-results"
          uv run --no-project python -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/browser-results/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/ >/dev/null
          node scripts/browser_compatibility.cjs http://127.0.0.1:4173 "$RUNNER_TEMP/browser-results" | tee "$RUNNER_TEMP/browser-results/checks.log"
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-compatibility-failure
          path: ${{ runner.temp }}/browser-results
          retention-days: 7
