name: Review invitation assets

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned development-only QR tools
        run: python -m pip install qrcode==8.2 pillow==12.0.0 zxing-cpp==2.3.0
      - name: Check page, standalone card, and independently decoded QR destination
        run: python -m unittest discover -s tests -p test_review_assets.py -v
